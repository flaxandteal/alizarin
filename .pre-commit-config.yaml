repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
      # The extension crates are outside the workspace, so the two checks above
      # never see them: check them when their sources change.
      - id: ext-rust
        name: extension crates (rustfmt + clippy)
        entry: bash scripts/check-ext-rust.sh
        language: system
        pass_filenames: false
        files: ^ext/.*\.rs$
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        pass_filenames: false
        types: [python]
      - id: eslint
        name: eslint
        entry: npx eslint js --ext .ts
        language: system
        pass_filenames: false
        types_or: [ts, javascript]
