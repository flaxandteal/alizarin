repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
      # The extension crates are outside the workspace, so the two checks above
      # never see them: check them when their sources change.
      - id: ext-rust
        name: extension crates (rustfmt + clippy)
        entry: bash scripts/check-ext-rust.sh
        language: system
        pass_filenames: false
        files: ^ext/.*\.rs$
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        pass_filenames: false
        types: [python]
      - id: eslint
        name: eslint
        entry: npx eslint js --ext .ts
        language: system
        pass_filenames: false
        types_or: [ts, javascript]
      # Tests that can pass without checking anything (PARITY-RESEARCH.md, D);
      # known ones are listed in tests/guard-allowlist.json.
      - id: test-integrity
        name: test integrity guard
        entry: python3 scripts/guards/test_integrity.py
        language: system
        pass_filenames: false
        files: (^tests/|/tests/|^tests/guard-allowlist\.json$)
      # No extension binding links alizarin-core
      # (notes/extension-interface-split.md).
      - id: no-second-core
        name: no second core guard
        entry: python3 scripts/guards/no_second_core.py
        language: system
        pass_filenames: false
        files: ^(ext/[^/]+/[^/]+/Cargo\.toml|crates/alizarin-extension-api/Cargo\.toml)$
