[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "alizarin-pg"
version = "2.0.0a129"
description = "PostgreSQL COPY format extension for Alizarin"
requires-python = ">=3.9"
dependencies = [
    "alizarin>=2.0.0a129",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.maturin]
python-source = "python"
module-name = "alizarin_pg._rust"
features = ["pyo3/extension-module"]
