[package]
name = "alizarin-clm-napi"
version = "2.0.0-alpha.148"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "NAPI binding for the Alizarin CLM (reference) extension"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Its C ABI only: no alizarin-core (see notes/extension-interface-split.md).
alizarin-clm-core = { path = "../core", default-features = false }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
