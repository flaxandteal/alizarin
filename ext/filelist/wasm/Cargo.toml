[package]
name = "alizarin-filelist-wasm"
version = "2.0.0-alpha.148"
edition = "2021"
description = "WASM bindings for alizarin-filelist-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No alizarin-core (see notes/extension-interface-split.md).
alizarin-filelist-core = { path = "../core", default-features = false }
# Its cycle-safe js_json for arguments from JavaScript.
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api", version = "=2.0.0-alpha.148", features = ["wasm"] }
wasm-bindgen = "0.2.84"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
