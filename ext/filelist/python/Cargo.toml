[package]
name = "alizarin-filelist"
version = "2.0.0-alpha.148"
edition = "2021"
description = "File List datatype extension for Alizarin"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3-ext"]
pyo3-ext = ["pyo3"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api" }
# Its C ABI only: no alizarin-core (see notes/extension-interface-split.md).
alizarin-filelist-core = { path = "../core", default-features = false }
