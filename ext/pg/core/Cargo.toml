[package]
name = "alizarin-pg-core"
version = "2.0.0-alpha.148"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "PostgreSQL COPY format output for Alizarin resources"

[features]
default = ["core"]
# The StaticResource API; the *_fields writers need nothing of core.
core = ["dep:alizarin-core"]

[dependencies]
serde_json = "1.0"
alizarin-core = { path = "../../../crates/alizarin-core", version = "=2.0.0-alpha.148", optional = true }
