[package]
name = "alizarin-pg"
version = "2.0.0-alpha.148"
edition = "2021"
description = "PostgreSQL COPY format extension for Alizarin"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3-ext"]
pyo3-ext = ["pyo3"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"], optional = true }
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api" }
# Without core: alizarin converts, and hands over rows (RowSinkInfo).
alizarin-pg-core = { path = "../core", default-features = false }
