[package]
name = "alizarin-geo-wasm"
version = "2.0.0-alpha.137"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "WASM bindings for alizarin-geo-core (geojson validation)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alizarin-geo-core = { path = "../core" }
wasm-bindgen = "0.2.84"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
# uuid (via alizarin-core) needs a wasm randomness source on wasm32.
uuid = { version = "1.0", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

# Skip wasm-pack's auto wasm-opt: the npm `wasm-opt` package is capped at
# binaryen 112, which cannot parse the reference-types/bulk-memory opcodes the
# current toolchain emits (geo's binary trips "invalid code after misc prefix:
# 17" = table.fill). Matches crates/alizarin-wasm, which disables it for the same
# reason. Optimize in a separate release step with a modern (v121+) wasm-opt if
# size matters.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
