[package]
name = "alizarin-geo-wasm"
version = "2.0.0-alpha.149"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "WASM bindings for alizarin-geo-core (geojson validation)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No alizarin-core (see notes/extension-interface-split.md).
alizarin-geo-core = { path = "../core", default-features = false }
# Its cycle-safe js_json for arguments from JavaScript.
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api", version = "=2.0.0-alpha.149", features = ["wasm"] }
wasm-bindgen = "0.2.84"
# To call the host's JS graph lookup from the UTM derive provider.
js-sys = "0.3"
serde = "1.0"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
