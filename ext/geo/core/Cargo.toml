[package]
name = "alizarin-geo-core"
version = "2.0.0-alpha.149"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Shared geospatial (geojson-feature-collection) type logic for Alizarin"

[features]
default = ["core"]
# The in-process handler and UTM registration; the C ABI and WASM paths need
# no core.
core = ["dep:alizarin-core"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
geojson = "0.24"
# Pure-Rust proj4 port; WASM-safe. default-features off to drop its
# `multi-thread` and `binaries` defaults — we only build proj-strings for UTM.
proj4rs = { version = "0.1.10", default-features = false }
alizarin-core = { path = "../../../crates/alizarin-core", version = "=2.0.0-alpha.149", optional = true }
# C-ABI TypeHandlerInfo builder (shared by the python + napi bindings).
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api", version = "=2.0.0-alpha.149" }
