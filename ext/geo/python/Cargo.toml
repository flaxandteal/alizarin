[package]
name = "alizarin-geo"
version = "2.0.0-alpha.134"
edition = "2021"
description = "Geospatial (geojson-feature-collection) extension for Alizarin"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3-ext"]
pyo3-ext = ["pyo3"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"], optional = true }
serde_json = "1.0"
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api" }
alizarin-geo-core = { path = "../core" }

[dev-dependencies]
