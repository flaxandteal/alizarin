[package]
name = "alizarin-geo"
version = "2.0.0-alpha.149"
edition = "2021"
description = "Geospatial (geojson-feature-collection) extension for Alizarin"

[lib]
# Not `_rust`: every ext's library is uplifted into the shared target/ under
# its lib name, so a shared name lets one ext's build hand maturin another's.
# pyproject.toml's module-name installs it as alizarin_geo._rust.
name = "alizarin_geo_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3-ext"]
pyo3-ext = ["pyo3"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"], optional = true }
serde_json = "1.0"
alizarin-extension-api = { path = "../../../crates/alizarin-extension-api" }
# Its C ABI only: no alizarin-core (see notes/extension-interface-split.md).
alizarin-geo-core = { path = "../core", default-features = false }

[dev-dependencies]
