[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "alizarin-geo"
version = "2.0.0b6"
description = "Geospatial (geojson-feature-collection) extension for Alizarin"
requires-python = ">=3.9"
dependencies = [
    "alizarin>=2.0.0b6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.maturin]
python-source = "python"
module-name = "alizarin_geo._rust"
features = ["pyo3/extension-module"]
