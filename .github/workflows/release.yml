name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.0.1-alpha.1)'
        required: true
        type: string

# Four jobs so a single package failing no longer silently sinks the release or
# blocks the others:
#   build              -> build once, test, pack tarballs, cut the GH release.
#   publish-crates-core-> alizarin-extension-api then alizarin-core, SERIAL, because
#                         every other crate depends on core being on crates.io first.
#   publish-npm        -> every npm tarball, parallel matrix (fail-fast: false).
#   publish-crates-ext -> every ext/*/core, parallel matrix, after core is up.
# Any failed matrix leg turns the whole run red (and the UI names which package),
# while its siblings still publish. Publishing a version that already exists is
# tolerated, so a re-run after fixing one package is safe.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      npm_tarballs: ${{ steps.lists.outputs.npm_tarballs }}
      crate_exts: ${{ steps.lists.outputs.crate_exts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: |
          BINARYEN_VERSION=version_121
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C /tmp
          sudo cp /tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt /usr/local/bin/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build WASM
        working-directory: crates/alizarin-wasm
        run: |
          wasm-pack build --target web --out-dir ../../pkg --out-name alizarin --release
          echo "WASM build complete. Contents of pkg/:"
          ls -lh ../../pkg/

      # Build WASM for JS extensions that have their own Rust crates.
      # Must happen before npm run build, as the full bundle inlines extension WASM.
      - name: Build extension WASM crates
        run: |
          for wasm_dir in ext/*/wasm/; do
            [ -f "$wasm_dir/Cargo.toml" ] || continue
            ext_name=$(basename "$(dirname "$wasm_dir")")
            echo "=== Building $ext_name WASM ==="
            (cd "$wasm_dir" && wasm-pack build --target web --release)
          done

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript/JavaScript bundle
        run: npm run build

      # Build all JS extensions (ext/*/js/) and pack each to the repo root.
      - name: Build JS extensions and create tarballs
        run: |
          for ext_dir in ext/*/js/; do
            [ -f "$ext_dir/package.json" ] || continue
            ext_name=$(basename "$(dirname "$ext_dir")")
            echo "=== Building @alizarin/$ext_name ==="
            (cd "$ext_dir" && npm install && npm run build && npm pack && mv alizarin-*.tgz ../../../)
          done

      - name: Prepare package for npm
        run: |
          # Remove pkg/.gitignore created by wasm-pack so pkg/ contents are in the tarball.
          rm -f pkg/.gitignore

      - name: Create main tarball
        run: |
          npm pack
          echo "Main tarball contents:"
          tar -tzf alizarin-*.tgz | grep -E "(pkg/|dist/)" | head -20

      - name: Run tests
        run: npm test

      - name: Get version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Auto-discover what to publish: every packed tarball, and every ext/*/core
      # crate. Emitted as JSON arrays for the downstream matrices.
      - name: Compute publish lists
        id: lists
        run: |
          echo "npm_tarballs=$(ls *.tgz | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
          echo "crate_exts=$(for d in ext/*/core; do [ -f "$d/Cargo.toml" ] && basename "$(dirname "$d")"; done | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
          echo "npm tarballs: $(ls *.tgz | tr '\n' ' ')"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') }}
          files: |
            *.tgz
          body: |
            ## Installation

            Install this release directly from GitHub:

            ```bash
            npm install ${{ github.repository }}#${{ steps.get_version.outputs.version }}
            ```

            Or install from the tarball:

            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-${{ steps.get_version.outputs.version }}.tgz
            ```

            ### Extensions

            **@alizarin/clm** - CLM display serializers for reference/concept datatypes:
            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-clm-${{ steps.get_version.outputs.version }}.tgz
            ```

            **@alizarin/filelist** - File list datatype view models and display serializers:
            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-filelist-${{ steps.get_version.outputs.version }}.tgz
            ```

            **@alizarin/geo** - GeoJSON validation for the geojson-feature-collection datatype:
            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-geo-${{ steps.get_version.outputs.version }}.tgz
            ```

            Then import to register:
            ```typescript
            import '@alizarin/clm';
            import '@alizarin/filelist';
            import '@alizarin/geo';
            ```

            Native (NAPI) backends for these extensions ship from the companion
            `release-napi` workflow as `@alizarin/clm-napi`, `@alizarin/filelist-napi`
            and `@alizarin/geo-napi`.

            ## What's Included

            **alizarin:**
            - Pre-built WASM binary (`pkg/`)
            - Bundled JavaScript/TypeScript distribution (`dist/`)
            - Type definitions
            - Source maps

            **@alizarin/clm:**
            - Display serializers for CLM reference datatypes
            - Auto-registers when imported

            **@alizarin/filelist:**
            - View models for file-list datatypes
            - Display serializers for file-list
            - Auto-registers when imported

            ## Changes

            See commits since last release for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload npm tarballs for the publish matrix
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: '*.tgz'
          retention-days: 1
          if-no-files-found: error

  # crates.io, phase 1: the foundation everything depends on, SERIAL and in order.
  # extension-api -> core. A failure here fails the run and (via `needs`) stops the
  # ext crates from attempting a publish that would only fail against a missing core.
  publish-crates-core:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Publish foundation crates (serial, dependency order)
        run: |
          # Publish one crate dir: tolerate "already uploaded" (safe re-runs),
          # retry past crates.io index lag, return non-zero on a genuine failure.
          publish() {
            local dir="$1" out
            for attempt in 1 2 3; do
              if out=$( (cd "$dir" && cargo publish --allow-dirty) 2>&1 ); then
                echo "$out"; echo "  ✓ $dir"; return 0
              fi
              echo "$out"
              if echo "$out" | grep -qiE 'already (exists|uploaded)'; then
                echo "  = $dir already on crates.io"; return 0
              fi
              echo "  retry $dir in 30s (crates.io index lag)…"; sleep 30
            done
            echo "::error::failed to publish $dir after retries"
            return 1
          }
          publish crates/alizarin-extension-api || exit 1
          publish crates/alizarin-core || exit 1

  # npm: every tarball in parallel. One failing leg reddens the run but the others
  # still publish, and the matrix names which package failed.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC Trusted Publishing + provenance
    strategy:
      fail-fast: false
      matrix:
        tarball: ${{ fromJSON(needs.build.outputs.npm_tarballs) }}
    steps:
      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
      # Node 24 ships an npm new enough for the OIDC handshake (Node 22's npm 10.x
      # silently fails it with a misleading 404).
      - name: Set up Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish ${{ matrix.tarball }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if echo "$VERSION" | grep -qE '(alpha|beta)'; then TAG="--tag alpha"; else TAG=""; fi
          if out=$(npm publish "${{ matrix.tarball }}" --provenance --access public $TAG 2>&1); then
            echo "$out"; echo "  ✓ published ${{ matrix.tarball }}"
          elif echo "$out" | grep -qiE 'cannot publish over|previously published|already published'; then
            echo "$out"; echo "  = ${{ matrix.tarball }} already published, tolerating"
          else
            echo "$out"; echo "::error::failed to publish ${{ matrix.tarball }}"; exit 1
          fi

  # crates.io, phase 2: every ext/*/core, in parallel, after core is live. They only
  # depend on alizarin-core (no inter-ext deps), so order among them is irrelevant.
  publish-crates-ext:
    needs: [build, publish-crates-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.build.outputs.crate_exts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Publish ext/${{ matrix.crate }}/core
        run: |
          publish() {
            local dir="$1" out
            for attempt in 1 2 3; do
              if out=$( (cd "$dir" && cargo publish --allow-dirty) 2>&1 ); then
                echo "$out"; echo "  ✓ $dir"; return 0
              fi
              echo "$out"
              if echo "$out" | grep -qiE 'already (exists|uploaded)'; then
                echo "  = $dir already on crates.io"; return 0
              fi
              echo "  retry $dir in 30s (crates.io index lag)…"; sleep 30
            done
            echo "::error::failed to publish $dir after retries"
            return 1
          }
          publish "ext/${{ matrix.crate }}/core" || exit 1
