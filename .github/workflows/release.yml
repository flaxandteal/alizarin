name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.0.1-alpha.1)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: |
          BINARYEN_VERSION=version_121
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C /tmp
          sudo cp /tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt /usr/local/bin/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build WASM
        working-directory: crates/alizarin-wasm
        run: |
          wasm-pack build --target web --out-dir ../../pkg --out-name alizarin --release
          echo "WASM build complete. Contents of pkg/:"
          ls -lh ../../pkg/

      # Build WASM for JS extensions that have their own Rust crates
      # Must happen before npm run build, as the full bundle inlines extension WASM
      - name: Build extension WASM crates
        run: |
          for wasm_dir in ext/*/wasm/; do
            [ -f "$wasm_dir/Cargo.toml" ] || continue
            ext_name=$(basename "$(dirname "$wasm_dir")")
            echo "=== Building $ext_name WASM ==="
            cd "$wasm_dir"
            wasm-pack build --target web --release
            cd - > /dev/null
          done

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript/JavaScript bundle
        run: npm run build

      # Build all JS extensions (ext/*/js/)
      - name: Build JS extensions and create tarballs
        run: |
          for ext_dir in ext/*/js/; do
            [ -f "$ext_dir/package.json" ] || continue
            ext_name=$(basename "$(dirname "$ext_dir")")
            echo "=== Building @alizarin/$ext_name ==="
            cd "$ext_dir"
            npm install
            npm run build
            npm pack
            mv alizarin-*.tgz ../../../
            cd - > /dev/null
          done

      - name: Verify build artifacts
        run: |
          echo "Checking dist directory:"
          ls -lh dist/
          echo ""
          echo "Checking pkg directory:"
          ls -lh pkg/
          echo ""
          echo "Checking JS extension dist directories:"
          for ext_dir in ext/*/js/; do
            [ -f "$ext_dir/package.json" ] || continue
            ext_name=$(basename "$(dirname "$ext_dir")")
            echo "  @alizarin/$ext_name:"
            ls -lh "$ext_dir/dist/" 2>/dev/null || echo "    (no dist)"
          done
          echo ""
          echo "Checking tarballs in root:"
          ls -lh *.tgz || echo "No tarballs yet"
          echo ""
          echo "Checking package.json files array includes required directories"
          cat package.json | grep -A 5 '"files"'

      # temp: disable tests - name: Run tests
      # temp: disable tests   run: npm test

      - name: Prepare package for npm
        run: |
          # Remove pkg/.gitignore created by wasm-pack so pkg/ contents are included in tarball
          rm -f pkg/.gitignore
          echo "Removed pkg/.gitignore to ensure WASM files are included in package"

      - name: Create tarball for npm installation
        run: |
          # Create a clean package tarball that npm can install
          npm pack
          echo ""
          echo "Tarball contents:"
          tar -tzf alizarin-*.tgz | grep -E "(pkg/|dist/)" | head -20

      - name: Get version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') }}
          files: |
            *.tgz
          body: |
            ## Installation

            Install this release directly from GitHub:

            ```bash
            npm install ${{ github.repository }}#${{ steps.get_version.outputs.version }}
            ```

            Or install from the tarball:

            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-${{ steps.get_version.outputs.version }}.tgz
            ```

            ### Extensions

            **@alizarin/clm** - CLM display serializers for reference/concept datatypes:
            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-clm-${{ steps.get_version.outputs.version }}.tgz
            ```

            **@alizarin/filelist** - File list datatype view models and display serializers:
            ```bash
            npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/alizarin-filelist-${{ steps.get_version.outputs.version }}.tgz
            ```

            Then import to register:
            ```typescript
            import '@alizarin/clm';
            import '@alizarin/filelist';
            ```

            ## What's Included

            **alizarin:**
            - Pre-built WASM binary (`pkg/`)
            - Bundled JavaScript/TypeScript distribution (`dist/`)
            - Type definitions
            - Source maps

            **@alizarin/clm:**
            - Display serializers for CLM reference datatypes
            - Auto-registers when imported

            **@alizarin/filelist:**
            - View models for file-list datatypes
            - Display serializers for file-list
            - Auto-registers when imported

            ## Changes

            See commits since last release for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (Trusted Publishing)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if echo "$VERSION" | grep -qE '(alpha|beta)'; then
            TAG="--tag alpha"
          else
            TAG=""
          fi

          # Publish main alizarin package
          npm publish --provenance --access public $TAG

          # Publish @alizarin/* JS extensions (ext/*/js/)
          for ext_dir in ext/*/js/; do
            [ -d "$ext_dir/dist" ] || continue
            ext_name=$(basename "$(dirname "$ext_dir")")
            echo "=== Publishing @alizarin/$ext_name ==="
            cd "$ext_dir"
            npm publish --provenance --access public $TAG
            cd - > /dev/null
          done

      - name: Publish crates to crates.io (alizarin-core + all ext-core, auto-discovered)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
        run: |
          # Publish one crate dir, tolerating "already uploaded" and retrying past
          # the crates.io index lag that trips an ext crate depending on a
          # just-published alizarin-core.
          publish() {
            local dir="$1" out
            for attempt in 1 2 3; do
              if out=$( (cd "$dir" && cargo publish --allow-dirty) 2>&1 ); then
                echo "$out"; echo "  ✓ $dir"; return 0
              fi
              echo "$out"
              echo "$out" | grep -qiE 'already (exists|uploaded)' && { echo "  = $dir already on crates.io"; return 0; }
              echo "  retry $dir in 30s (crates.io index lag)…"; sleep 30
            done
            echo "::warning::failed to publish $dir after retries"
          }

          # Core first - every ext-core crate deps it by version.
          publish crates/alizarin-core

          # Every ext-core crate, auto-discovered - no maintained list. They only
          # dep alizarin-core (no inter-ext deps), so the order among them is
          # irrelevant. New ext crates are picked up automatically.
          for ext in ext/*/core; do
            [ -f "$ext/Cargo.toml" ] && publish "$ext"
          done

      - name: Output installation instructions
        run: |
          echo "::notice::Release created! Install with: npm install ${{ github.repository }}#${{ steps.get_version.outputs.version }}"
